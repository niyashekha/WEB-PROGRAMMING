<html>
<head>
    <title>Background Colour Changer</title>
    <style>
        body {
            text-align: center;
            padding-top: 150px;
            font-family: Arial;
            background-color: lightblue;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Background Colour Changer</h1>
    <button onclick="changeColor()">Change Colour </button>
    <script>
    var i = 0;
    var colors = ["red", "blue", "green", "yellow", "pink", "orange", "purple"];
    function changeColor() 
    {
    document.body.style.backgroundColor = colors[i];
    i = (i + 1) % colors.length;
    }
    </script>
</body>
</html>
