<html>
<head>
    <title>Javascript using String and Math function</title>
  <style>
        body {
            background-color: #d9f2e6;
            font-family: Arial, sans-serif;
            margin: 30px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: white;
            background-color: #006644;
            padding: 15px;
            border-radius: 10px;
        }

        h2 {
            color: #004d33;
            background-color: #a3e6cc;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<h1>JavaScript String and Math Object Functions</h1>
</head>
<h2>JavaScript String Object Functions</h2>
<script>
var str1 = prompt("Enter the First String:");
var str2 = prompt("Enter the Second String:");
var c1 = prompt("Enter the character to find its position:");
var oldWord = prompt("Enter the word to replace:");
var newWord = prompt("Enter the replacement word:");
document.write("1. First String: ", str1, "<br><br>");
document.write("2. Second String: ", str2, "<br><br>");
document.write("3. Length of String1: ", str1.length, "<br><br>");
document.write("4. Uppercase: ", str1.toUpperCase(), "<br><br>");
document.write("5. Lowercase: ", str1.toLowerCase(), "<br><br>");
document.write("6. First Character of String1: ", str1.charAt(0), "<br><br>");
document.write("7. Last Character of String2: ", str2.charAt(str2.length - 1), "<br><br>");
document.write("8. Substring: ", str1.substring(0, 4), "<br><br>");
document.write("9. Position of " + c1 + " in First String: ", str1.indexOf(c1), "<br><br>");
document.write("10. Replace " + oldWord + " with " + newWord + ": ", str1.replace(oldWord, newWord), "<br><br>");
document.write("11. Concatenation: ", str1.concat(" ", str2), "<br><br>");
document.write("12. Slice: ", str1.slice(0, 10), "<br><br>");
document.write("13. Split: ", str2.split(" "), "<br><br>");
</script>
<h2>JavaScript Math Object Functions</h2>
<script>
var numbers = [];
var count = prompt("How many numbers do you want to enter?");
for (var i = 0; i < count; i++) 
{
    numbers[i] = Number(prompt("Enter number " + (i + 1) + ":"));
}
var m = prompt("Enter the number to find power:");
var n = prompt("Enter the number to the power:");
var num = numbers[0];
document.write("1. Array of numbers: ", numbers, "<br><br>");
document.write("2. Square Root of ", numbers[1], ": ", Math.sqrt(numbers[1]), "<br><br>");
document.write("3. Power(",m,",",n,"): ", Math.pow(m, n), "<br><br>");
document.write("4. Round: ", Math.round(num), "<br><br>");
document.write("5. Ceiling: ", Math.ceil(num), "<br><br>");
document.write("6. Floor: ", Math.floor(num), "<br><br>");
document.write("7. Absolute Value of ",num,": ", Math.abs(num), "<br><br>");
document.write("8. Maximum: ", Math.max(...numbers), "<br><br>");
document.write("9. Minimum: ", Math.min(...numbers), "<br><br>");
document.write("10. Random Number: ", Math.random(), "<br><br>");
</script>
</body>
</html>
